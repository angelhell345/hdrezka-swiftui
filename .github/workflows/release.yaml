name: Build macOS 14 Intel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create dummy Firebase config
        run: |
          mkdir -p HDrezka/Resources
          if [ ! -f HDrezka/Resources/GoogleService-Info.plist ]; then
            cat << 'EOF' > HDrezka/Resources/GoogleService-Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>API_KEY</key>
            <string>AIzaSyDummyKeyForBuild1234567890</string>
            <key>GCM_SENDER_ID</key>
            <string>123456789012</string>
            <key>PLIST_VERSION</key>
            <string>1</string>
            <key>BUNDLE_ID</key>
            <string>io.silentsea.hdrezka</string>
            <key>PROJECT_ID</key>
            <string>hdrezka-dummy</string>
            <key>GOOGLE_APP_ID</key>
            <string>1:123456789012:ios:1234567890abcdef</string>
          </dict>
          </plist>
          EOF
          fi

      - name: Trust macro plugins
        run: |
          defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES
          defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidatation -bool YES

      - name: Build app for Intel (x86_64)
        run: |
          xcodebuild archive \
            -scheme HDrezka \
            -project HDrezka.xcodeproj \
            -destination 'generic/platform=macOS' \
            -archivePath build/HDrezka.xcarchive \
            ARCHS="x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            SKIP_INSTALL=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Prepare and sign app
        run: |
          mkdir -p release
          cp -R build/HDrezka.xcarchive/Products/Applications/HDrezka.app release/
          codesign --force --deep --sign - release/HDrezka.app

      - name: Create DMG
        run: |
          npx create-dmg release/HDrezka.app release/ --no-code-sign --no-version-in-filename --overwrite

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: HDrezka-macOS14-Intel
          path: release/HDrezka.dmg
          retention-days: 5
